<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Student Profile Manager</h1>

    <input type="text" id="name" placeholder="Full Name"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="number" id="age" placeholder="Age"><br><br>
    <input type="text" id="course" placeholder="Course"><br><br>

    <button id="saveBtn">💾 Save to LocalStorage</button>
    <button id="getBtn">📋 Get from LocalStorage</button>
    <button id="removeBtn">🗑️ Remove from LocalStorage</button>
    <button id="clearBtn">❌ Clear All LocalStorage</button>
    <br><br>

    <button id="sessionSaveBtn">💾 Save to SessionStorage</button>
    <button id="sessionGetBtn">📋 Get from SessionStorage</button>
    <button id="sessionRemoveBtn">🗑️ Remove from SessionStorage</button>
    <br><br>

    <div id="output"></div>

    <script src="./script.js"></script>
</body>

</html>
