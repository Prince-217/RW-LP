<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="pageTitle">Student Task Manager</h1>

    <div id="taskContainer">
        <span id="taskCount">Total Tasks: 5</span>
    </div>

    <ul id="taskList">
        <li>Complete JS Assignment</li>
        <li>Watch DOM Lecture</li>
        <li>Practice LeetCode</li>
        <li>Read Chapter 5</li>
        <li>Submit Project</li>
    </ul>

    <button id="removeBtn">Remove Second Task</button>
    <button id="deleteBtn">Delete Task Container</button>
    <button id="replaceBtn">Replace Title</button>
    <button id="traverseBtn">Show Traversal Info</button>
    <button id="hoverBtn">Hover Me</button>

    <br><br>

    <form id="taskForm">
        <input type="text" id="newTask" placeholder="Enter new task...">
        <button type="submit">Add Task</button>
    </form>

    <script src="./script.js"></script>
</body>

</html>
