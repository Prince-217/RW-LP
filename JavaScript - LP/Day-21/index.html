<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>RW Skill Education — Student Registration</h1>

    <form id="regForm">
        <input type="text" id="fullName" placeholder="Full Name"><br><br>
        <input type="email" id="email" placeholder="Email Address"><br><br>
        <input type="number" id="age" placeholder="Age"><br><br>
        <input type="text" id="phone" placeholder="Phone Number"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <input type="password" id="confirmPassword" placeholder="Confirm Password"><br><br>
        <button type="submit">Register</button>
    </form>
    
    <p id="msg"></p>
    <div id="studInfo"></div>

    <script src="./script.js"></script>

</body>

</html>
